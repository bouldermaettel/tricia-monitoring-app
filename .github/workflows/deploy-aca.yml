name: Deploy ACA

on:
  workflow_dispatch:
  push:
    branches: ["001-monitoring-tool", "main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build and push backend image
        run: |
          az acr build --registry ${{ secrets.ACR_NAME }} --image tricia-monitoring-backend:${{ github.sha }} -f backend/Dockerfile .
      - name: Build and push frontend image
        run: |
          az acr build --registry ${{ secrets.ACR_NAME }} --image tricia-monitoring-frontend:${{ github.sha }} -f frontend/Dockerfile .
      - name: Run migrations
        run: |
          az containerapp job start --name tricia-monitoring-migrate --resource-group ${{ secrets.AZURE_RG }}
      - name: Deploy backend ACA
        run: |
          az containerapp update --name tricia-monitoring-backend --resource-group ${{ secrets.AZURE_RG }} --image ${{ secrets.ACR_NAME }}.azurecr.io/tricia-monitoring-backend:${{ github.sha }}
      - name: Deploy frontend ACA
        run: |
          az containerapp update --name tricia-monitoring-frontend --resource-group ${{ secrets.AZURE_RG }} --image ${{ secrets.ACR_NAME }}.azurecr.io/tricia-monitoring-frontend:${{ github.sha }}
